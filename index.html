<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سباق الحلوى</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">

    <header class="hud">
      <span id="track-name"></span>
      <span>الحلوى: <b id="candies">0</b></span>
      <span>التقدم: <b id="progress">0%</b></span>
    </header>

    <div class="stage">
      <canvas id="game" width="400" height="700"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="ov-title"></h2>
        <p id="ov-text"></p>
        <div id="tracks" class="tracks"></div>
      </div>
    </div>

    <p class="hint">اضغط يسار الشاشة أو يمينها للتحرك، أو استخدم الأسهم على الكمبيوتر</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
