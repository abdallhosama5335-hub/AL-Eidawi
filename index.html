<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mow & Haul: حصاد العشب</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #2b2b2b; font-family: Tahoma, Arial, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: flex-start;
    color: #fff; font-size: 17px; font-weight: bold;
    text-shadow: 0 1px 4px #000; pointer-events: none;
  }
  #msg {
    position: fixed; top: 40%; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 24px; font-weight: bold; text-shadow: 0 2px 6px #000;
    pointer-events: none; opacity: 0; transition: opacity .3s;
  }
  #controls {
    position: fixed; bottom: 18px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .group { display: flex; gap: 12px; }
  button {
    width: 68px; height: 68px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.6);
    background: rgba(0,0,0,.35); color: #fff; font-size: 26px;
    -webkit-tap-highlight-color: transparent;
  }
  button:active, button.on { background: rgba(255,255,255,.3); }
  #toolBtn {
    width: auto; height: 52px; border-radius: 26px;
    padding: 0 16px; font-size: 16px; font-weight: bold;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="stats"></div>
  <div id="toolName"></div>
</div>
<div id="msg"></div>

<div id="controls">
  <div class="group">
    <button data-hold="left">◀</button>
    <button data-hold="right">▶</button>
  </div>
  <div class="group">
    <button id="toolBtn">🔧 تغيير الأداة</button>
    <button data-hold="down">▼</button>
    <button data-hold="up">▲</button>
  </div>
</div>

<script>
/* =========================================================
   الإعدادات الأساسية (غيّر القيم هنا كما تشاء)
   ========================================================= */
const CONFIG = {
  moveSpeed: 150,      // سرعة الحركة (بكسل/ثانية)
  turnSpeed: 2.4,      // سرعة الانعطاف (راديان/ثانية)
  acceleration: 220,   // التسارع
  cutRadius: 26,       // نطاق القطع الافتراضي
  scorePerGrass: 10,   // النقاط لكل قطعة عشب
  maxCapacity: 20,     // السعة القصوى قبل التفريغ
  cellSize: 20,        // حجم خلية العشب
  cols: 40,            // عدد الأعمدة (800 بكسل)
  rows: 30             // عدد الصفوف (600 بكسل)
};

/* =========================================================
   الأدوات: كل أداة لها شكل ومعاملات خاصة
   shape: 'circle' (منجل دوار) | 'wide' (منشار عريض) | 'shears' (مقص)
   ========================================================= */
const TOOLS = [
  { name: 'منجل دوار',  shape: 'circle', cutRadius: 26, rotationSpeed: 14, cutInterval: 0.1,  color: '#e74c3c' },
  { name: 'منشار عريض', shape: 'wide',   cutRadius: 36, rotationSpeed: 6,  cutInterval: 0.15, color: '#3498db' },
  { name: 'مقص دقيق',   shape: 'shears', cutRadius: 16, rotationSpeed: 5,  cutInterval: 0.08, color: '#2ecc71' }
];

/* =========================================================
   الحالة
   ========================================================= */
const WORLD_W = CONFIG.cols * CONFIG.cellSize;
const WORLD_H = CONFIG.rows * CONFIG.cellSize;
const DROP = { x: 20, y: WORLD_H - 110, w: 130, h: 90 };   // منطقة التفريغ

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');
const toolNameEl = document.getElementById('toolName');
const msgEl = document.getElementById('msg');

let grid = [];           // 1 = عشب، 0 = مقطوع
let grassLeft = 0;
let score = 0;
let load = 0;
let msgTimer = 0;

const player = {
  x: WORLD_W / 2, y: WORLD_H / 2,
  angle: -Math.PI / 2,
  speed: 0,
  spin: 0,
  toolIndex: 0,
  cutTimer: 0
};

const keys = {};
const held = {};

function resetField() {
  grid = [];
  grassLeft = 0;
  for (let r = 0; r < CONFIG.rows; r++) {
    const row = [];
    for (let c = 0; c < CONFIG.cols; c++) {
      row.push(1);
      grassLeft++;
    }
    grid.push(row);
  }
}

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();
resetField();

/* =========================================================
   الإدخال: لوحة المفاتيح + أزرار الشاشة
   ========================================================= */
const keyMap = {
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right'
};

addEventListener('keydown', e => {
  if (keyMap[e.code]) { keys[keyMap[e.code]] = true; e.preventDefault(); }
  if (e.code === 'Space') { switchTool(); e.preventDefault(); }
});
addEventListener('keyup', e => {
  if (keyMap[e.code]) keys[keyMap[e.code]] = false;
});

document.querySelectorAll('[data-hold]').forEach(btn => {
  const name = btn.dataset.hold;
  const on = () => { held[name] = true; btn.classList.add('on'); };
  const off = () => { held[name] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); on(); });
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('pointercancel', off);
});

document.getElementById('toolBtn').addEventListener('click', switchTool);

function switchTool() {
  player.toolIndex = (player.toolIndex + 1) % TOOLS.length;
  showMessage('الأداة: ' + TOOLS[player.toolIndex].name);
}

function isDown(name) { return keys[name] || held[name]; }

/* =========================================================
   المنطق
   ========================================================= */
function update(dt) {
  const tool = TOOLS[player.toolIndex];

  // الحركة
  const fwd = (isDown('up') ? 1 : 0) - (isDown('down') ? 1 : 0);
  const turn = (isDown('right') ? 1 : 0) - (isDown('left') ? 1 : 0);

  const target = fwd * CONFIG.moveSpeed;
  const diff = target - player.speed;
  const step = CONFIG.acceleration * dt;
  player.speed += Math.max(-step, Math.min(step, diff));

  if (Math.abs(player.speed) > 5) {
    player.angle += turn * CONFIG.turnSpeed * dt * Math.sign(player.speed);
  }

  player.x += Math.cos(player.angle) * player.speed * dt;
  player.y += Math.sin(player.angle) * player.speed * dt;
  player.x = Math.max(20, Math.min(WORLD_W - 20, player.x));
  player.y = Math.max(20, Math.min(WORLD_H - 20, player.y));

  // دوران الأداة
  player.spin += tool.rotationSpeed * dt;

  // القطع
  const cutX = player.x + Math.cos(player.angle) * 34;
  const cutY = player.y + Math.sin(player.angle) * 34;
  player.cutTimer += dt;
  if (player.cutTimer >= tool.cutInterval) {
    player.cutTimer = 0;
    cutAt(cutX, cutY, tool.cutRadius || CONFIG.cutRadius);
  }

  // التفريغ
  if (load > 0 &&
      player.x > DROP.x && player.x < DROP.x + DROP.w &&
      player.y > DROP.y && player.y < DROP.y + DROP.h) {
    showMessage('تم تفريغ ' + load + ' حزمة');
    load = 0;
  }

  // انتهاء الحقل
  if (grassLeft === 0 && msgTimer <= 0) {
    showMessage('انتهى الحقل! النقاط: ' + score, 999);
  }

  if (msgTimer > 0) {
    msgTimer -= dt;
    if (msgTimer <= 0) msgEl.style.opacity = 0;
  }
}

function cutAt(cx, cy, radius) {
  const cs = CONFIG.cellSize;
  const minC = Math.max(0, Math.floor((cx - radius) / cs));
  const maxC = Math.min(CONFIG.cols - 1, Math.floor((cx + radius) / cs));
  const minR = Math.max(0, Math.floor((cy - radius) / cs));
  const maxR = Math.min(CONFIG.rows - 1, Math.floor((cy + radius) / cs));

  for (let r = minR; r <= maxR; r++) {
    for (let c = minC; c <= maxC; c++) {
      if (grid[r][c] !== 1) continue;
      const px = c * cs + cs / 2;
      const py = r * cs + cs / 2;
      if (Math.hypot(px - cx, py - cy) > radius) continue;
      if (load >= CONFIG.maxCapacity) return;   // الحاوية ممتلئة
      grid[r][c] = 0;
      grassLeft--;
      load++;
      score += CONFIG.scorePerGrass;
    }
  }
}

function showMessage(text, duration = 1.8) {
  msgEl.textContent = text;
  msgEl.style.opacity = 1;
  msgTimer = duration;
}

/* =========================================================
   الرسم
   ========================================================= */
function draw() {
  const scale = Math.min(canvas.width, canvas.height) / 380;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#5a4a2a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(canvas.width / 2 - player.x * scale, canvas.height / 2 - player.y * scale);
  ctx.scale(scale, scale);

  drawField();
  drawDropoff();
  drawVehicle();

  ctx.restore();
  updateHUD();
}

function drawField() {
  const cs = CONFIG.cellSize;
  for (let r = 0; r < CONFIG.rows; r++) {
    for (let c = 0; c < CONFIG.cols; c++) {
      const x = c * cs, y = r * cs;
      if (grid[r][c] === 1) {
        ctx.fillStyle = (r + c) % 2 ? '#e0b43a' : '#caa030';
        ctx.fillRect(x, y, cs, cs);
        ctx.strokeStyle = 'rgba(120,90,10,.35)';
        ctx.beginPath();
        ctx.moveTo(x + cs * 0.3, y + cs);
        ctx.lineTo(x + cs * 0.4, y + cs * 0.2);
        ctx.moveTo(x + cs * 0.7, y + cs);
        ctx.lineTo(x + cs * 0.6, y + cs * 0.3);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#8b6a3a';
        ctx.fillRect(x, y, cs, cs);
      }
    }
  }
}

function drawDropoff() {
  ctx.fillStyle = 'rgba(70,140,220,.45)';
  ctx.fillRect(DROP.x, DROP.y, DROP.w, DROP.h);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.strokeRect(DROP.x, DROP.y, DROP.w, DROP.h);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Tahoma';
  ctx.textAlign = 'center';
  ctx.fillText('التفريغ', DROP.x + DROP.w / 2, DROP.y + DROP.h / 2 + 5);
}

function drawVehicle() {
  const tool = TOOLS[player.toolIndex];

  // منطقة القطع (توضيحية)
  const cx = Math.cos(player.angle) * 34;
  const cy = Math.sin(player.angle) * 34;
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.beginPath();
  ctx.arc(player.x + cx, player.y + cy, tool.cutRadius || CONFIG.cutRadius, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  // العجلات
  ctx.fillStyle = '#111';
  ctx.fillRect(-14, -16, 10, 6);
  ctx.fillRect(-14, 10, 10, 6);
  ctx.fillRect(8, -16, 10, 6);
  ctx.fillRect(8, 10, 10, 6);

  // الهيكل
  ctx.fillStyle = '#f1c40f';
  ctx.fillRect(-18, -12, 36, 24);
  ctx.strokeStyle = '#7f6000';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(-18, -12, 36, 24);

  // المقصورة
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(-8, -8, 14, 16);

  // الأداة (أمام المركبة)
  ctx.translate(30, 0);
  drawTool(tool);
  ctx.restore();
}

function drawTool(tool) {
  ctx.strokeStyle = tool.color;
  ctx.fillStyle = tool.color;
  ctx.lineWidth = 3;

  if (tool.shape === 'circle') {
    for (const y of [-12, 12]) {
      ctx.save();
      ctx.translate(0, y);
      ctx.rotate(player.spin);
      ctx.beginPath();
      ctx.arc(0, 0, 9, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(9, 0);
        ctx.stroke();
      }
      ctx.restore();
    }
  } else if (tool.shape === 'wide') {
    const r = tool.cutRadius;
    ctx.fillRect(-3, -r, 6, r * 2);
    ctx.fillStyle = '#ddd';
    for (let y = -r + 4; y < r; y += 8) {
      ctx.fillRect(-6, y, 12, 2);
    }
  } else if (tool.shape === 'shears') {
    const open = Math.abs(Math.sin(player.spin)) * 0.5;
    for (const sign of [-1, 1]) {
      ctx.save();
      ctx.rotate(sign * open);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(16, 0);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function updateHUD() {
  statsEl.textContent = 'النقاط: ' + score + '   |   الحمولة: ' + load + '/' + CONFIG.maxCapacity;
  toolNameEl.textContent = 'الأداة: ' + TOOLS[player.toolIndex].name;
}

/* =========================================================
   حلقة اللعب
   ========================================================= */
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
